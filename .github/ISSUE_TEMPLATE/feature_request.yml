name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that cf-orbs does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. If it changes a rule in docs/architecture.md, say which one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried or thought about.
